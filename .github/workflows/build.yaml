name: Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "nui", "nui-next"]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: spectra-paper
          path: apps/paper/build/libs/spectra-paper-*.jar

  node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:js
